# Local development only. The application's canonical SQL lives in ../migrations/
# and is applied with npm run db:migrate, never with supabase db reset/push.
project_id = "ai-app-jumpstart"

[api]
port = 54321
schemas = ["public", "graphql_public"]
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = false

[db.seed]
enabled = false

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback?next=/account",
  "http://localhost:3000/auth/callback?next=/account/password",
]
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true

[local_smtp]
enabled = true
port = 54324
