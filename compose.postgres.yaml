# docker compose -f compose.yaml -f compose.postgres.yaml up --build
# Set POSTGRES_PASSWORD in .env (Compose interpolation), and APP_API_KEYS in .env.local.
services:
  app:
    environment:
      DATA_PROVIDER: postgres
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/app
    depends_on:
      migrate:
        condition: service_completed_successfully
  migrate:
    build: .
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/app
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
