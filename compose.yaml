services:
  app:
    build: .
    init: true
    ports: ["127.0.0.1:3000:3000"]
    env_file: .env.local
    environment:
      DATA_PROVIDER: sqlite
      SQLITE_PATH: /app/.data/app.sqlite
    volumes:
      - app-data:/app/.data
      - eve-data:/app/.eve
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  app-data:
  eve-data:
