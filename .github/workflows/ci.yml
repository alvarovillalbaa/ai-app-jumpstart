name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:docs
      - run: npm run check:openapi
      - run: npm run check:container-pins
      - run: npm test
      - run: npm run check:cloud-templates
      - run: npm run check:account-data-inventory
      - run: npm run test:ai
      - run: npm run test:reference-mcp
      - run: npm run test:session-runtime
      - run: npm run test:workflow-retention
      - run: npm run test:agent-uploads
      - run: TMPDIR=/tmp PG_CLIENT_RUNNER=./scripts/testing/postgres-client-docker.sh npm run test:workflow-postgres
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ai-eval-results
          path: tests/fixtures/eve/.eve/evals
          include-hidden-files: true
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:local
      - run: npm run test:e2e
      - run: npm run test:upload-scans
      - run: npm run test:auth
      - run: npm run test:chat
      - run: npm run test:chat:uploads
      - run: npm run test:auth:postgres
      - run: npm run test:chat:postgres
      - run: npm run test:chat:uploads:postgres
      - run: npm run test:auth:postgres:storage-supabase
      - run: npm run test:chat:uploads:postgres:storage-supabase
      - run: npm run test:quickstart
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-results
          path: |
            playwright-report
            test-results
  supabase-accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fresh-clone managed onboarding and real account contracts
        run: npm run test:managed-quickstart
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: supabase-account-results
          path: |
            playwright-report
            test-results
  convex-accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:local
      - name: Disposable Convex account, chat and reviewed-file contracts with local and Supabase Storage
        run: npm run test:convex:accounts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: convex-account-results
          path: |
            playwright-report
            test-results
  vercel-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:vercel-build
  amplify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:amplify-build
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app_test
          POSTGRES_PASSWORD: isolated-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app_test -d app_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATA_PROVIDER: postgres
      DATABASE_URL: postgresql://app_test:isolated-ci-password@localhost:5432/app_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate -- --dry-run
      - run: npm run db:migrate
      - run: npm run db:migrate -- --dry-run
      - run: npm run db:types:check:ci
      - run: npm run test:integration
  provider-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:providers
      - run: TMPDIR=/tmp PG_CLIENT_RUNNER=./scripts/testing/postgres-client-docker.sh npm run test:postgres-backup
      - run: npm run --silent sbom > dependency-sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-sbom
          path: dependency-sbom.cdx.json
          retention-days: 14
      - run: npm audit --audit-level=high
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:container
      - run: npm run test:chat:container
      - run: npm run test:chat:container:postgres:storage-supabase
  workflow-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm run test:split-ingress
      - run: npm run test:public-ingress
      - run: npm run test:compose-data-providers
      - run: npm run test:amplify-ingress
      - run: npm run test:workflow-compose
  upload-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:upload-scanner:compose
