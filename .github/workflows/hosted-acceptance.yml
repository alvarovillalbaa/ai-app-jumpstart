name: Hosted acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-acceptance
  cancel-in-progress: false

jobs:
  staging:
    name: Deployed browser and data contract
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: hosted-staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the deployed REST contract and browser/data behavior
        run: npm run smoke:hosted -- --contract --browser
        env:
          APP_API_URL: ${{ vars.APP_API_URL }}
          APP_API_TOKEN: ${{ secrets.APP_API_TOKEN }}
          APP_API_OTHER_TOKEN: ${{ secrets.APP_API_OTHER_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
