# No TCP listener. Only the gateway receives this private socket volume.
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /run/clamav/clamd.sock
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket yes
Foreground yes
LogTime yes
LogClean no
LogVerbose no
StreamMaxLength 5M
MaxFileSize 5M
MaxScanSize 25M
MaxRecursion 16
MaxFiles 1000
MaxThreads 4
MaxQueue 8
# Hitting an engine limit must reject the file rather than report it clean.
AlertExceedsMax yes
ConcurrentDatabaseReload no
SelfCheck 60
